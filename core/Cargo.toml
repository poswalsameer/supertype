[package]
name = "supertype-core"
version = "0.1.0"
edition = "2021"
description = "Supertype Rust core engine — privacy-first local voice engine"
license = "MIT"
authors = ["Supertype"]

[lib]
name = "supertype_core"
crate-type = ["staticlib", "cdylib", "lib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }
thiserror = "2.0"
parking_lot = "0.12"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.38", features = ["rt", "rt-multi-thread", "sync", "time"] }
once_cell = "1.19"
rtrb = "0.2"
hound = "3.5"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tempfile = "3.10"

[profile.release]
lto = false
codegen-units = 16
panic = "abort"

[profile.dev]
panic = "abort"
